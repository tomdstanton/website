[project]
site_name = "Bytes & Bacteria"
site_description = "Microbial bioinformatics, pathogen genomics & open-source software by Tom Stanton"
site_url = "https://tomdstanton.com/"
site_author = "Tom Stanton"
repo_url = "https://github.com/tomdstanton/website"
repo_name = "tomdstanton/website"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = '© 2026 <a href="https://tomdstanton.com" target="_blank" rel="noopener">Tom Stanton</a> · Prose <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener">CC BY 4.0</a> · Code MIT'
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/github-stars.js",
  "javascripts/rogue-scholar.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
font.text = "Plus Jakarta Sans"
font.code = "IBM Plex Mono"
icon.repo = "fontawesome/brands/github"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.prune",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
]

# Classic Swiss Brut: Warm archival paper default, with toggle to Obsidian Dark
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false
orcid = "0000-0002-8898-4432"

[[project.extra.social]]
icon = "fontawesome/brands/orcid"
link = "https://orcid.org/0000-0002-8898-4432"
name = "ORCID"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tomdstanton"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/tomstantonmicro"
name = "Bluesky"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/tomdstanton"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/tomstantonmicro"
name = "X (Twitter)"

[[project.extra.social]]
icon = "fontawesome/brands/strava"
link = "https://www.strava.com/athletes/38105733"
name = "Strava"

[[project.extra.social]]
icon = "lucide/mail"
link = "mailto:tomdstanton@gmail.com"
name = "Email"

[[project.extra.social]]
icon = "fontawesome/solid/rss"
link = "/feed_rss_created.xml"
name = "RSS Feed"

[project.extra.giscus]
repo = "tomdstanton/website"
repo_id = "R_kgDOTcEEsg"
category = "Announcements"
category_id = "DIC_kwDOTcEEss4DBc2X"

# The blog lives at the site root; posts get clean /blog/<slug>/ URLs.
[project.plugins.blog]
blog_dir = "."
post_url_format = "blog/{slug}"
pagination_per_page = 5
authors_file = "{blog}/.authors.yml"

[project.plugins.tags]

[project.plugins.rss]
match_path = "posts/.*"
abstract_chars_count = -1
date_from_meta.as_creation = "date"

[project.plugins.meta]

[project.plugins.meta-descriptions]
trim = true

[project.plugins.awesome-nav]

[project.plugins.mkdocs-nav-weight]
index_weight = -10

[project.plugins.gh-admonitions]

[project.plugins.table-reader]
data_path = "docs"

[project.plugins.git-revision-date-localized]
type = "iso_date"
enable_creation_date = true
fallback_to_build_date = true
strict = false
exclude = ["index.md", "bib.md", "tags.md", "projects/index.md"]

[project.plugins.llmstxt]
markdown_description = "Microbial bioinformatics, pathogen genomics, and open-source Rust/Python research software by Dr. Tom Stanton (Monash University)."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Editorial Dispatches" = ["posts/*.md", "posts/**/*.md"]
"Open-Source Software" = ["projects/*.md"]
"Publications & Dossier" = ["bib.md", "about.md"]

[project.plugins.glightbox]

[project.plugins.social]
cards_layout_options.background_color = "#F7F7F5"
cards_layout_options.color = "#0A0A0A"

[project.plugins.privacy]
assets_include = [
  "fonts.googleapis.com/*",
  "fonts.gstatic.com/*",
  "avatars.githubusercontent.com/*",
  "unpkg.com/glightbox*",
]

[project.plugins.optimize]
optimize_png = false
print_gain_summary = true

[project.plugins.minify]
minify_html = true
minify_css = true
minify_js = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true, title = "Contents" }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.betterem" = {}
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true, auto_title = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.snippets" = { base_path = ["."], check_paths = true }
"pymdownx.superfences" = { custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ] }
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"zensical.extensions.preview" = { sources = { include = ["posts/*", "projects/*", "about.md"], exclude = ["projects/index.md"] }, targets = { include = ["posts/*", "projects/*", "bib.md", "about.md"] } }
